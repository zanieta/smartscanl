# Reverse-proxy + static server for VulnSense.
# Replace APP_HOST with your subdomain (e.g. vulnsense.example.com) and the
# /opt/vulnsense/static path if your install dir differs.
#
# Phase 0 (WSL2 local): keep this HTTP block; add APP_HOST to /etc/hosts.
#   Optionally add a self-signed 443 server block for TLS testing.
# Phase 1 (server): run `certbot --nginx -d APP_HOST` — it rewrites this file
#   to add the 443 TLS block and an 80->443 redirect automatically.

server {
    listen 80;
    server_name APP_HOST;

    location /static/ {
        alias /opt/vulnsense/static/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto lets the app see the real scheme (e.g. request.url.scheme).
        # NOTE: the session cookie's Secure flag is controlled by COOKIE_SECURE in the
        # app .env (https_only), NOT by this header — set COOKIE_SECURE=1 behind TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # PC/web scans run synchronously in-request (nmap can exceed nginx's default
        # 60s proxy_read_timeout -> 504). Allow long scans to complete.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
